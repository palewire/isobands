name: Continuous deployment

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.7"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install system GDAL
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: gdal
          create-args: >-
            python=3.13
            gdal=3.12.2
          init-shell: bash

      - name: Configure GDAL build environment
        shell: bash -el {0}
        run: |
          gdal-config --version
          test "$(gdal-config --version)" = "3.12.2"
          echo "${CONDA_PREFIX}/bin" >> "$GITHUB_PATH"
          echo "GDAL_CONFIG=${CONDA_PREFIX}/bin/gdal-config" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=${CONDA_PREFIX}/lib" >> "$GITHUB_ENV"
          echo "DYLD_FALLBACK_LIBRARY_PATH=${CONDA_PREFIX}/lib" >> "$GITHUB_ENV"

      - name: Install Python dependencies
        run: make install-dev

      - name: Run static checks
        run: make check

      - name: Prune uv cache
        run: uv cache prune --ci

  test-python:
    name: Test Python code
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - id: install-uv
        name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.7"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install system GDAL
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: gdal
          create-args: >-
            python=3.13
            gdal=3.12.2
          init-shell: bash

      - name: Configure GDAL build environment
        shell: bash -el {0}
        run: |
          gdal-config --version
          test "$(gdal-config --version)" = "3.12.2"
          echo "${CONDA_PREFIX}/bin" >> "$GITHUB_PATH"
          echo "GDAL_CONFIG=${CONDA_PREFIX}/bin/gdal-config" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=${CONDA_PREFIX}/lib" >> "$GITHUB_ENV"
          echo "DYLD_FALLBACK_LIBRARY_PATH=${CONDA_PREFIX}/lib" >> "$GITHUB_ENV"

      - id: install-python
        name: Install Python
        run: uv python install ${{ matrix.python }}

      - id: install-python-dependencies
        name: Install Python dependencies
        run: make install-test UV_PYTHON=${{ matrix.python }}

      - id: tests
        name: Run tests
        run: make test UV_PYTHON=${{ matrix.python }}

      - name: Verify package distribution
        if: matrix.python == '3.13'
        run: make package-verify PACKAGE=isobands

      - name: Prune uv cache
        run: uv cache prune --ci

  test-macos:
    name: Smoke test macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.7"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install system GDAL
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: gdal
          create-args: >-
            python=3.13
            gdal=3.12.2
          init-shell: bash

      - name: Configure GDAL build environment
        shell: bash -el {0}
        run: |
          gdal-config --version
          test "$(gdal-config --version)" = "3.12.2"
          echo "${CONDA_PREFIX}/bin" >> "$GITHUB_PATH"
          echo "GDAL_CONFIG=${CONDA_PREFIX}/bin/gdal-config" >> "$GITHUB_ENV"
          echo "DYLD_FALLBACK_LIBRARY_PATH=${CONDA_PREFIX}/lib" >> "$GITHUB_ENV"

      - name: Install Python
        run: uv python install 3.13

      - name: Install Python dependencies
        run: make install-test UV_PYTHON=3.13

      - name: Run tests
        run: make test UV_PYTHON=3.13

      - name: Prune uv cache
        run: uv cache prune --ci

  build:
    name: Build release candidate
    runs-on: ubuntu-latest
    needs: [check, test-python, test-macos]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - id: install-uv
        name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.7"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Verify lockfile
        run: UV_NO_ENV_FILE=1 uv lock --check

      - id: build
        name: Build releases
        run: make build

      - name: Prune uv cache
        run: uv cache prune --ci

      - id: save
        name: Save artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate
          path: ./dist
          if-no-files-found: error

  release:
    name: PyPI release
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - id: fetch
        name: Fetch artifact
        uses: actions/download-artifact@v8
        with:
          name: release-candidate
          path: ./dist

      - id: publish
        name: Publish release
        uses: pypa/gh-action-pypi-publish@release/v1

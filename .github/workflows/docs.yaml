name: Documentation

permissions:
  contents: read

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v7

      - id: install-uv
        name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.7"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install system GDAL
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: gdal
          create-args: >-
            python=3.13
            gdal=3.13.2
          init-shell: bash

      - name: Configure GDAL build environment
        shell: bash -el {0}
        run: |
          gdal-config --version
          test "$(gdal-config --version)" = "3.13.2"
          echo "${CONDA_PREFIX}/bin" >> "$GITHUB_PATH"
          echo "GDAL_CONFIG=${CONDA_PREFIX}/bin/gdal-config" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=${CONDA_PREFIX}/lib" >> "$GITHUB_ENV"

      - id: install-python
        name: Install Python
        run: uv python install 3.13

      - id: install-python-dependencies
        name: Install Python dependencies
        run: make install-docs

      - id: build-sphinx-documentation
        name: Build Sphinx documentation
        run: make docs-check

      - name: Prune uv cache
        run: uv cache prune --ci

      - id: upload-release-candidate
        name: Upload release candidate
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate
          path: ./docs/_build/html/
          if-no-files-found: error
          retention-days: 7

  linkcheck:
    name: Check documentation links
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.7"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install system GDAL
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: gdal
          create-args: >-
            python=3.13
            gdal=3.13.2
          init-shell: bash

      - name: Configure GDAL build environment
        shell: bash -el {0}
        run: |
          gdal-config --version
          test "$(gdal-config --version)" = "3.13.2"
          echo "${CONDA_PREFIX}/bin" >> "$GITHUB_PATH"
          echo "GDAL_CONFIG=${CONDA_PREFIX}/bin/gdal-config" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=${CONDA_PREFIX}/lib" >> "$GITHUB_ENV"

      - name: Install Python dependencies
        run: make install-docs

      - name: Check documentation links
        run: make linkcheck

      - name: Prune uv cache
        run: uv cache prune --ci

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref_name == 'main' && vars.DOCS_DEPLOY_ENABLED == 'true'
    environment: docs-production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: docs-deploy
      cancel-in-progress: true
    steps:
      - name: Download release candidate
        uses: actions/download-artifact@v8
        with:
          name: release-candidate
          path: docs-site

      - id: configure-aws
        name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.DOCS_AWS_ROLE_ARN }}
          aws-region: ${{ vars.DOCS_AWS_REGION }}

      - id: upload-to-s3
        name: Upload documentation to Amazon S3
        run: |
          aws s3 sync ./docs-site/ \
            "s3://${{ secrets.DOCS_AWS_BUCKET }}/${{ secrets.DOCS_AWS_BASE_PATH }}/" \
            --acl public-read \
            --no-progress \
            --delete \
            --exact-timestamps

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iowa land-surface temperature after the 2020 derecho</title>
    <link href="https://unpkg.com/maplibre-gl@5.15.0/dist/maplibre-gl.css" rel="stylesheet">
    <style>
      body { margin: 0; }
      #map { height: 100vh; width: 100vw; }
      .legend {
        background: rgba(255, 255, 255, 0.92);
        bottom: 12px;
        font: 12px/1.35 sans-serif;
        padding: 10px 12px;
        position: absolute;
        right: 12px;
        z-index: 1;
      }
      .legend-title { font-weight: 700; margin-bottom: 6px; }
      .legend-row { align-items: center; display: flex; gap: 6px; }
      .legend-swatch { height: 12px; width: 12px; }
      .legend-swatch.nodata {
        background: #e6eaec;
        border: 1px solid #d8dfe2;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div class="legend" aria-label="Land-surface temperature legend">
      <div class="legend-title">Land-surface temperature</div>
      <div class="legend-row"><span class="legend-swatch" style="background: #2c7bb6"></span>Below 20°C</div>
      <div class="legend-row"><span class="legend-swatch" style="background: #abd9e9"></span>20°–25°C</div>
      <div class="legend-row"><span class="legend-swatch" style="background: #fdae61"></span>25°–30°C</div>
      <div class="legend-row"><span class="legend-swatch" style="background: #f46d43"></span>30°–35°C</div>
      <div class="legend-row"><span class="legend-swatch" style="background: #d7191c"></span>35°C and above</div>
      <div class="legend-row"><span class="legend-swatch nodata"></span>Unavailable: no data</div>
    </div>
    <script src="https://unpkg.com/maplibre-gl@5.15.0/dist/maplibre-gl.js"></script>
    <script>
      const cedarRapidsAirport = [-91.709, 41.884];
      const map = new maplibregl.Map({
        container: "map",
        style: "https://tiles.openfreemap.org/styles/bright",
        center: [-93.8, 42.1],
        zoom: 5.8,
        interactive: false,
        attributionControl: false,
      });

      map.on("load", () => {
        map.addSource("temperature", {
          type: "geojson",
          data: "iowa-land-surface-temperature-2020-08-12.geojson",
        });
        map.addSource("temperature-no-data", {
          type: "geojson",
          data: "iowa-temperature-no-data-2020-08-12.geojson",
        });
        const firstSymbolLayer = map.getStyle().layers.find(
          (layer) => layer.type === "symbol",
        );
        map.addLayer({
          id: "temperature-no-data",
          type: "fill",
          source: "temperature-no-data",
          paint: {
            "fill-color": "#e6eaec",
            "fill-opacity": 0.35,
          },
        }, firstSymbolLayer?.id);
        map.addLayer({
          id: "temperature-bands",
          type: "fill",
          source: "temperature",
          paint: {
            "fill-color": ["get", "color"],
            "fill-opacity": 0.35,
          },
        }, firstSymbolLayer?.id);

        new maplibregl.Popup({
          closeButton: false,
          closeOnClick: false,
          offset: 25,
        })
          .setLngLat(cedarRapidsAirport)
          .setHTML("<strong>Cedar Rapids Airport</strong><br>30.7°C")
          .addTo(map);
      });
    </script>
  </body>
</html>
